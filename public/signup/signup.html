<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ChatG</title>
    <link rel="stylesheet" href="styles/signup.css">
</head>

<body>
    <div class="card">
        <h2>Join ChatG</h2>
        <form id="form-id" onsubmit="formSubmit(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            <input type="submit" value="Create Account">
        </form>
        <a href="../login/login.html">Already have an account? Sign In</a>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const API_URL = "http://localhost:3000";
    async function formSubmit(e) {
        e.preventDefault();

        const submitBtn = e.target.querySelector('input[type="submit"]');
        const originalValue = submitBtn.value;
        submitBtn.value = 'Creating...';
        submitBtn.disabled = true;

        const name = event.target.name.value;
        const email = event.target.email.value;
        const phone = event.target.phone.value;
        const password = event.target.password.value;

        // Remove any existing messages
        const existingMessages = document.querySelectorAll('.error-message, .success-message');
        existingMessages.forEach(msg => msg.remove());

        if (name && email && phone && password) {
            const userData = { name, email, phone, password };
            try {
                const response = await axios.post(`${API_URL}/signup`, userData);
                const form = document.getElementById("form-id");
                form.reset();
                if (response.status === 200) {
                    showMessage('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = "../login/login.html";
                    }, 1500);
                } else {
                    throw new Error("Failed to sign up");
                }
            }
            catch (error) {
                console.log(JSON.stringify(error));
                if (error.response && error.response.status === 409) {
                    showMessage('User already exists. Please login instead.', 'error');
                    setTimeout(() => {
                        window.location.href = "../login/login.html";
                    }, 2000);
                } else {
                    showMessage('Failed to create account. Please try again.', 'error');
                }
            }
        }
        else {
            showMessage('Please fill in all the form fields', 'error');
        }

        submitBtn.value = originalValue;
        submitBtn.disabled = false;
    }

    function showMessage(message, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
        messageDiv.textContent = message;
        document.querySelector('.card').appendChild(messageDiv);
    }
</script>

</html>
