<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ChatG</title>
    <link rel="stylesheet" href="styles/login.css">
</head>

<body>
    <div class="card">
        <h2>Welcome Back</h2>
        <form id='form-id' onsubmit="formSubmit(event)">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
            <input type="submit" value="Sign In">
        </form>
        <a href="../signup/signup.html">New to ChatG? Create Account</a>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const API_URL = "http://localhost:3000";
    async function formSubmit(e) {
        e.preventDefault();

        const submitBtn = e.target.querySelector('input[type="submit"]');
        const originalValue = submitBtn.value;
        submitBtn.value = 'Signing In...';
        submitBtn.disabled = true;

        const email = event.target.email.value;
        const password = event.target.password.value;

        // Remove any existing messages
        const existingMessages = document.querySelectorAll('.error-message, .success-message');
        existingMessages.forEach(msg => msg.remove());

        if (email && password) {
            const userData = { email, password };

            try {
                const response = await axios.post(`${API_URL}/login`, userData);
                console.log(response.data);
                const form = document.getElementById("form-id");
                form.reset();
                if (response.status === 200) {
                    const token = response.data.token;
                    localStorage.setItem('token', token);
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = "../chatapp/chatapp.html";
                    }, 1000);
                } else {
                    throw new Error("Failed to login");
                }
            } catch (error) {
                console.log(JSON.stringify(error));
                if (error.response && error.response.status === 401) {
                    showMessage('Invalid email or password. Please try again.', 'error');
                } else if (error.response && error.response.status === 404) {
                    showMessage('User not found. Please sign up first.', 'error');
                } else {
                    showMessage('Login failed. Please try again.', 'error');
                }
            }
        } else {
            showMessage('Please fill in all the form fields', 'error');
        }

        submitBtn.value = originalValue;
        submitBtn.disabled = false;
    }

    function showMessage(message, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
        messageDiv.textContent = message;
        document.querySelector('.card').appendChild(messageDiv);
    }
</script>

</html>
